services:
  dev:
    build: .
    volumes:
      - type: bind
        source: ${PWD}
        target: /workspaces/project
      - type: bind
        source: ~/.config/opencode
        target: /home/agent/.config/opencode
      - type: bind
        source: ~/.local/share/opencode
        target: /home/agent/.local/share/opencode
      - type: bind
        source: ~/.local/state/opencode
        target: /home/agent/.local/state/opencode
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6275:6275"
    environment:
      - DANGEROUSLY_OMIT_AUTH=true
      - HOST=0.0.0.0
      - DANGEROUSLY_BIND_ALL_INTERFACES=true
      - ALLOWED_ORIGINS=http://localhost:6274
    entrypoint: []
    command: mcp-inspector
  otel:
    image: otel/opentelemetry-collector:latest 
    ports:
      - 4317:4317
      - 4318:4318
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
